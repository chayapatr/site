<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0a; color: #ccc; font-family: monospace; height: 100vh; display: flex; flex-direction: column; }

  #tabbar {
    display: flex;
    align-items: center;
    overflow-x: auto;
    border-bottom: 1px solid #1a1a1a;
    flex-shrink: 0;
  }
  .tab {
    display: flex;
    align-items: center;
    gap: 6px;
    max-width: 144px;
    padding: 6px 12px;
    font-size: 11px;
    border-right: 1px solid #1a1a1a;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    color: #444;
    background: none;
    border-top: none;
    border-left: none;
    border-bottom: none;
    flex-shrink: 0;
  }
  .tab.active { color: #ccc; background: #111; }
  .tab-label { overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .tab-loading { color: #333; flex-shrink: 0; }
  .tab-close { opacity: 0.4; flex-shrink: 0; cursor: pointer; }
  .tab-close:hover { opacity: 1; }
  #newtab { padding: 6px 12px; font-size: 11px; color: #333; background: none; border: none; cursor: pointer; flex-shrink: 0; }
  #newtab:hover { color: #888; }

  #toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    border-bottom: 1px solid #1a1a1a;
    padding: 6px 12px;
    flex-shrink: 0;
  }
  #back { font-size: 11px; color: #444; background: none; border: none; cursor: pointer; }
  #back:hover { color: #aaa; }
  #urlbar {
    flex: 1;
    background: #111;
    border: 1px solid #1a1a1a;
    color: #888;
    font-family: monospace;
    font-size: 11px;
    padding: 2px 8px;
    outline: none;
  }
  #urlbar:focus { border-color: #333; }

  #content { flex: 1; overflow-y: auto; }
  #webframe { width: 100%; height: 100%; border: none; display: none; }

  #homepage {
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }
  .section-label { font-size: 10px; color: #333; margin-bottom: 4px; }
  .link { display: block; font-size: 11px; color: #666; background: none; border: none; cursor: pointer; text-align: left; padding: 2px 0; }
  .link:hover { color: #ddd; }

  #docview { padding: 12px 16px; display: none; }
  #docview pre { font-size: 11px; color: #555; white-space: pre-wrap; }
  #docview h1,#docview h2,#docview h3 { color: #bbb; margin: 12px 0 6px; }
  #docview p { color: #666; font-size: 12px; line-height: 1.6; margin-bottom: 8px; }
  #docview a { color: #666; }
  #docview a:hover { color: #ccc; }
  #docview code { color: #aaa; }
  #docview li { color: #666; font-size: 12px; }
  #error { padding: 12px 16px; font-size: 11px; color: #c44; display: none; }
</style>
</head>
<body>

<div id="tabbar">
  <div id="tabs"></div>
  <button id="newtab">+</button>
</div>

<div id="toolbar">
  <button id="back">←</button>
  <input id="urlbar" placeholder="search or enter url" />
</div>

<div id="content">
  <div id="homepage"></div>
  <div id="docview"></div>
  <div id="error"></div>
  <iframe id="webframe" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
</div>

<script>
const VFS_ROOTS = ['/bin','/etc','/usr','/home','/proc','/dev','/sys']

function normalizeUrl(s) {
  if (!s) return ''
  if (s.startsWith('pub://') || s.startsWith('file://') || s.startsWith('http://') || s.startsWith('https://')) return s
  if (s.startsWith('/') && VFS_ROOTS.some(r => s.startsWith(r))) return 'file://' + s
  if (s.startsWith('/')) return 'pub://' + s.slice(1)
  if (/^[\w-]+(\.[\w-]+)+(\/|$)/.test(s)) return 'https://' + s
  return 'pub://' + s
}

let tabs = []
let activeIdx = 0

function newTab(url) {
  return { url: url || '', html: '', error: '', loading: false, history: [] }
}

function renderTabs() {
  const container = document.getElementById('tabs')
  container.innerHTML = ''
  tabs.forEach((t, i) => {
    const btn = document.createElement('button')
    btn.className = 'tab' + (i === activeIdx ? ' active' : '')
    const label = document.createElement('span')
    label.className = 'tab-label'
    label.textContent = t.url ? t.url.replace('pub://','').replace('file://','') : 'new tab'
    btn.appendChild(label)
    if (t.loading) {
      const ld = document.createElement('span')
      ld.className = 'tab-loading'
      ld.textContent = '...'
      btn.appendChild(ld)
    }
    const cl = document.createElement('span')
    cl.className = 'tab-close'
    cl.textContent = '×'
    cl.onclick = e => { e.stopPropagation(); closeTab(i) }
    btn.appendChild(cl)
    btn.onclick = () => { activeIdx = i; renderTabs(); renderContent() }
    container.appendChild(btn)
  })
}

function renderContent() {
  const t = tabs[activeIdx]
  document.getElementById('urlbar').value = t.url
  const homepage = document.getElementById('homepage')
  const docview = document.getElementById('docview')
  const errEl = document.getElementById('error')
  const frame = document.getElementById('webframe')

  homepage.style.display = 'none'
  docview.style.display = 'none'
  errEl.style.display = 'none'
  frame.style.display = 'none'

  if (t.error) {
    errEl.textContent = t.error
    errEl.style.display = 'block'
  } else if (!t.url && !t.html) {
    showHomepage()
  } else if (t.url.startsWith('http://') || t.url.startsWith('https://')) {
    frame.src = t.url
    frame.style.display = 'block'
    document.getElementById('content').style.overflow = 'hidden'
    document.getElementById('content').style.display = 'flex'
    document.getElementById('content').style.flexDirection = 'column'
    frame.style.flex = '1'
    frame.style.height = '100%'
  } else if (t.html) {
    docview.innerHTML = t.html
    docview.style.display = 'block'
    document.getElementById('content').style.overflow = 'auto'
  }
}

function showHomepage() {
  const homepage = document.getElementById('homepage')
  homepage.style.display = 'flex'
  homepage.innerHTML = `
    <div>
      <div class="section-label">pub://</div>
      <button class="link" data-url="pub://!@$">!@$</button>
    </div>
    <div>
      <div class="section-label">https://</div>
      ${['info.cern.ch','wikipedia.org','from.pub','wiby.me','poolsuite.net','archive.org','theuselessweb.com','example.com']
        .map(s => `<button class="link" data-url="https://${s}">${s}</button>`).join('')}
    </div>
  `
  homepage.querySelectorAll('[data-url]').forEach(btn => {
    btn.onclick = () => navigate(btn.dataset.url)
  })
}

async function loadTab(idx, url) {
  tabs[idx].error = ''
  tabs[idx].url = url
  tabs[idx].loading = true
  renderTabs()
  if (!url) { tabs[idx].loading = false; renderTabs(); renderContent(); return }

  try {
    if (url.startsWith('pub://')) {
      const slug = url.slice('pub://'.length)
      const res = await sys.fetch('https://garden.from.pub/' + slug + '.md')
      if (!res.ok) throw new Error('pub://' + slug + ': not found')
      tabs[idx].html = await renderMarkdown(res.text)
    } else if (url.startsWith('file://')) {
      const path = url.slice('file://'.length)
      const raw = await sys.read(path)
      tabs[idx].html = path.endsWith('.md') ? await renderMarkdown(raw) : '<pre>' + escHtml(raw) + '</pre>'
    } else if (url.startsWith('http://') || url.startsWith('https://')) {
      tabs[idx].html = ''
    } else {
      throw new Error('unknown scheme: ' + url)
    }
  } catch(e) {
    tabs[idx].error = String(e)
  }
  tabs[idx].loading = false
  renderTabs()
  renderContent()
  sys.setTitle(url.replace('pub://','').replace('file://','') || 'Browser')
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
}

async function renderMarkdown(text) {
  // simple markdown: headers, bold, links, paragraphs
  let html = escHtml(text)
  html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>')
  html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>')
  html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>')
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
  html = html.replace(/\*(.+?)\*/g, '<em>$1</em>')
  html = html.replace(/`(.+?)`/g, '<code>$1</code>')
  html = html.replace(/\[(.+?)\]\((.+?)\)/g, '<a href="$2">$1</a>')
  html = html.replace(/^- (.+)$/gm, '<li>$1</li>')
  html = html.replace(/\n\n/g, '</p><p>')
  return '<p>' + html + '</p>'
}

function navigate(url, idx = activeIdx) {
  const normalized = normalizeUrl(url)
  tabs[idx].history = [tabs[idx].url, ...tabs[idx].history]
  loadTab(idx, normalized)
}

function goBack() {
  const t = tabs[activeIdx]
  if (!t.history.length) return
  const prev = t.history[0]
  tabs[activeIdx].history = t.history.slice(1)
  loadTab(activeIdx, prev)
}

function openTab(url) {
  tabs.push(newTab(url ? normalizeUrl(url) : ''))
  activeIdx = tabs.length - 1
  renderTabs()
  loadTab(activeIdx, tabs[activeIdx].url)
}

function closeTab(idx) {
  if (tabs.length === 1) return
  tabs.splice(idx, 1)
  activeIdx = Math.min(activeIdx, tabs.length - 1)
  renderTabs()
  renderContent()
}

document.getElementById('back').onclick = goBack
document.getElementById('newtab').onclick = () => openTab()
document.getElementById('urlbar').addEventListener('keydown', e => {
  if (e.key === 'Enter') navigate(e.target.value)
})
document.getElementById('docview').addEventListener('click', e => {
  const a = e.target.closest('a')
  if (!a) return
  e.preventDefault()
  navigate(a.getAttribute('href'))
})

// init
const initUrl = sys.args[0] ? normalizeUrl(sys.args[0]) : ''
tabs.push(newTab(initUrl))
renderTabs()
loadTab(0, initUrl)
</script>
</body>
</html>
